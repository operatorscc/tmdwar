name: Patch Next.js security release

on:
  push:
    branches:
      - security/patch-nextjs-15-5-28

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: security/patch-nextjs-15-5-28
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade patched Next.js packages and regenerate lockfile
        run: npm install next@15.5.28 eslint-config-next@15.5.28 --save-exact

      - name: Run unit tests
        run: npx --yes tsx --test tests/*.test.ts

      - name: Check dependency audit summary
        run: npm audit --json > npm-audit-report.json || true

      - name: Commit lockfile and package changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: patch Next.js to 15.5.28 [security-deps]" || exit 0
          git push origin security/patch-nextjs-15-5-28
