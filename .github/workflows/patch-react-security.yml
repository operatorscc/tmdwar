name: Patch React Server Components security release

on:
  push:
    branches:
      - security/patch-react-19-3-1

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: security/patch-react-19-3-1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade React and React DOM to patched release
        run: npm install react@19.3.1 react-dom@19.3.1 --save-exact

      - name: Verify resolved versions
        run: node -e "const p=require('./package-lock.json'); for (const n of ['react','react-dom','next','sharp']) console.log(n, p.packages['node_modules/'+n]?.version ?? 'transitive/not root'); if(p.packages['node_modules/react']?.version!=='19.3.1'||p.packages['node_modules/react-dom']?.version!=='19.3.1'||p.packages['node_modules/sharp']?.version<'0.35.5') process.exit(1)"

      - name: Run unit tests
        run: npx --yes tsx --test tests/*.test.ts

      - name: Build production application
        run: npm run build

      - name: Commit package and lockfile changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: patch React to 19.3.1" || exit 0
          git push origin security/patch-react-19-3-1
